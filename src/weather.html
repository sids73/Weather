<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delaware, OH weather</title>
<style>
:root{--bg:#e9eff1;--ink:#1b2830;--mute:#566872;--card:#fbfdfd;--line:#cfdadf;--accent:#1c6d86;--warn:#a8281f;--warnbg:#fde8e6;--watch:#8a5a00;--watchbg:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e4edf1;--mute:#8a9fab;--card:#172229;--line:#263640;--accent:#74c4dc;--warn:#ff9a90;--warnbg:#3a1a18;--watch:#f2c35c;--watchbg:#33280d}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:600 1.5rem Georgia,"Times New Roman",serif;margin:0}
h2{font-size:1rem;font-weight:600;margin:0 0 10px}
.mute{color:var(--mute);font-size:.875rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid section{margin:0}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.temp{font:300 4.5rem/1 Georgia,"Times New Roman",serif}
.cond{font-size:1.125rem;margin:4px 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
dt{color:var(--mute)}dd{margin:0}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hr{flex:0 0 64px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px}
.hr b{display:block;font-size:1.125rem}
.bar{height:4px;background:var(--line);border-radius:2px;margin:6px 6px 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.day{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.day:first-of-type{border-top:0}
.hilo{font-variant-numeric:tabular-nums;white-space:nowrap}
.sun{display:flex;gap:28px;flex-wrap:wrap}
.sun b{display:block;font-size:1.25rem;font-weight:500}
#radar img{width:100%;display:block;border-radius:6px;background:var(--line);min-height:200px}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--watchbg);color:var(--watch);border:1px solid currentColor}
.alert.severe{background:var(--warnbg);color:var(--warn)}
.alert summary{cursor:pointer;font-weight:600}
.alert p{white-space:pre-line;color:var(--ink);margin:8px 0 0;font-size:.9rem}
.err{color:var(--warn);font-size:.875rem}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{font:inherit;padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<nav class="tabs" aria-label="Location">
  <button data-tab="de" aria-selected="true">Delaware, OH</button>
  <button data-tab="mum" aria-selected="false">Mumbai</button>
  <button data-tab="mng" aria-selected="false">Mangalore</button>
</nav>

<div id="tab-de">
<header>
  <h1 id="place">Weather</h1>
  <span class="mute" id="updated">Loading…</span>
</header>

<div id="alerts"></div>

<div class="grid">
  <section id="now"><h2>Right now</h2><div class="mute">Loading…</div></section>
  <section id="radar"><h2>Radar</h2>
    <a href="https://radar.weather.gov/station/KILN/standard" target="_blank" rel="noopener">
      <img id="radarimg" alt="Radar loop for the Wilmington, OH station" src="">
    </a>
  </section>
</div>

<section style="margin-top:14px"><h2>Next 24 hours</h2><div class="strip" id="hourly"></div></section>
<section><h2>Forecast</h2><div id="daily"></div></section>
<section><h2>Sun</h2><div class="sun" id="sun"></div></section>
<p class="mute">Data: National Weather Service (api.weather.gov)</p>
<p class="err" id="err"></p>
</div>

<div id="tab-mum" hidden></div>
<div id="tab-mng" hidden></div>
</main>

<script>
// ---- Config ----
const LAT = 40.2478, LON = -83.0443;      // from your /points lookup
const RADAR = 'KILN';
const API = 'https://api.weather.gov';

// ---- Helpers ----
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = (v, d = 0) => v == null ? '–' : Number(v).toFixed(d);
const cToF = c => c == null ? null : c * 9 / 5 + 32;
let TZ = 'America/New_York';
const fmtTime = (iso, o = {hour: 'numeric', minute: '2-digit'}) =>
  new Date(iso).toLocaleTimeString([], {...o, timeZone: TZ});

// Retries transient failures (network errors, 429, 5xx) with a short backoff.
async function get(url, tries = 3) {
  for (let i = 1; ; i++) {
    let r;
    try { r = await fetch(url, {headers: {Accept: 'application/geo+json'}}); }
    catch (e) { if (i >= tries) throw e; await new Promise(res => setTimeout(res, 1500 * i)); continue; }
    if (r.ok) return r.json();
    if ((r.status === 429 || r.status >= 500) && i < tries) { await new Promise(res => setTimeout(res, 1500 * i)); continue; }
    throw new Error(`${r.status} ${url}`);
  }
}
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }

// Grid point + URLs change rarely; refetch daily (also refreshes sun times).
async function getPoint() {
  const c = load('pt');
  if (c && Date.now() - c.t < 864e5) return c.p;
  const p = (await get(`${API}/points/${LAT},${LON}`)).properties;
  store('pt', {t: Date.now(), p});
  return p;
}

// ---- Panels ----
async function loadAlerts() {
  const data = await get(`${API}/alerts/active?point=${LAT},${LON}`);
  $('alerts').innerHTML = data.features.map(f => {
    const a = f.properties;
    const severe = ['Extreme', 'Severe'].includes(a.severity);
    return `<details class="alert ${severe ? 'severe' : ''}">
      <summary>${esc(a.headline || a.event)}</summary>
      <p>${esc(a.description)}${a.instruction ? '\n\n' + esc(a.instruction) : ''}</p>
    </details>`;
  }).join('');
}

async function loadNow(p) {
  const stations = (await get(p.observationStations)).features.slice(0, 3);
  const observations = await Promise.all(stations.map(async s =>
    (await get(`${API}/stations/${s.properties.stationIdentifier}/observations/latest`)).properties
  ));
  const obs = observations
    .filter(o => o.temperature.value != null && Number.isFinite(Date.parse(o.timestamp)))
    .sort((a, b) => Date.parse(b.timestamp) - Date.parse(a.timestamp))[0];
  if (!obs) { $('now').innerHTML = '<h2>Right now</h2><div class="mute">No recent observation.</div>'; return; }
  const t = cToF(obs.temperature.value);
  const feels = cToF((obs.heatIndex.value ?? obs.windChill.value));
  const wind = obs.windSpeed.value == null ? null : obs.windSpeed.value * 0.621371;
  const gust = obs.windGust.value == null ? null : obs.windGust.value * 0.621371;
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const dir = obs.windDirection.value == null ? '' : dirs[Math.round(obs.windDirection.value / 45) % 8];
  $('now').innerHTML = `<h2>Right now</h2>
    <div class="temp">${n(t)}°</div>
    <div class="cond">${esc(obs.textDescription || '')}</div>
    <dl>
      ${feels != null ? `<dt>Feels like</dt><dd>${n(feels)}°</dd>` : ''}
      <dt>Wind</dt><dd>${dir} ${n(wind)} mph${gust ? `, gusts ${n(gust)}` : ''}</dd>
      <dt>Humidity</dt><dd>${n(obs.relativeHumidity.value)}%</dd>
      <dt>Pressure</dt><dd>${n(obs.barometricPressure.value / 3386.389, 2)} inHg</dd>
      <dt>Visibility</dt><dd>${n(obs.visibility.value / 1609.34, 1)} mi</dd>
    </dl>
    <div class="mute" style="margin-top:10px">Observed ${fmtTime(obs.timestamp)} at ${esc(obs.station.split('/').pop())}</div>`;
}

async function loadHourly(p) {
  const periods = (await get(p.forecastHourly)).properties.periods.slice(0, 24);
  $('hourly').innerHTML = periods.map(h => {
    const pop = h.probabilityOfPrecipitation?.value ?? 0;
    return `<div class="hr" title="${esc(h.shortForecast)}">
      <span class="mute">${fmtTime(h.startTime, {hour: 'numeric'})}</span>
      <b>${h.temperature}°</b>
      <div class="bar"><i style="width:${pop}%"></i></div>
      <span class="mute">${pop}%</span></div>`;
  }).join('');
}

async function loadDaily(p) {
  const periods = (await get(p.forecast)).properties.periods;
  const days = [];
  for (const q of periods) {
    const last = days[days.length - 1];
    if (q.isDaytime) days.push({d: q});
    else if (last && last.d && !last.n) last.n = q;
    else days.push({n: q});
  }
  $('daily').innerHTML = days.map(({d, n: ni}) => {
    const main = d || ni;
    const pop = Math.max(d?.probabilityOfPrecipitation?.value ?? 0, ni?.probabilityOfPrecipitation?.value ?? 0);
    return `<div class="day">
      <strong>${esc(main.name)}</strong>
      <span>${esc(main.shortForecast)}${pop ? ` <span class="mute">· ${pop}% rain</span>` : ''}</span>
      <span class="hilo">${d ? d.temperature + '°' : ''}${d && ni ? ' / ' : ''}<span class="mute">${ni ? ni.temperature + '°' : ''}</span></span>
    </div>`;
  }).join('');
}

function renderSun(p) {
  const a = p.astronomicalData;
  const t = k => fmtTime(a[k]);
  $('sun').innerHTML = `<div><span class="mute">Sunrise</span><b>${t('sunrise')}</b></div>
    <div><span class="mute">Sunset</span><b>${t('sunset')}</b></div>
    <div><span class="mute">First light</span><b>${t('civilTwilightBegin')}</b></div>
    <div><span class="mute">Last light</span><b>${t('civilTwilightEnd')}</b></div>
    <div class="mute" style="align-self:end">${new Date(a.sunrise).toLocaleDateString([], {weekday: 'long', timeZone: TZ})}</div>`;
}

function refreshRadar() {
  $('radarimg').src = `https://radar.weather.gov/ridge/standard/${RADAR}_loop.gif?t=${Date.now()}`;
}

// ---- Scheduler: each panel fails independently ----
function every(minutes, fn, upd = 'updated', errId = 'err', tz) {
  let retry;
  const run = async () => {
    try { await fn(); clearTimeout(retry); $(errId).textContent = ''; $(upd).textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', timeZone: tz || TZ}); }
    catch (e) { $(errId).textContent = 'Some data failed to load (retrying in a minute): ' + e.message; clearTimeout(retry); retry = setTimeout(run, 60000); }
  };
  run();
  setInterval(run, minutes * 60000);
}

// ---- Extra cities (Open-Meteo: free, no key, works outside the US) ----
// To add another city: add an entry here and a button in the <nav class="tabs">.
const CITIES = {
  mum: {id: 'm', name: 'Mumbai, India',   lat: 19.076,  lon: 72.8777, tz: 'Asia/Kolkata'},
  mng: {id: 'g', name: 'Mangalore, India', lat: 12.9141, lon: 74.856,  tz: 'Asia/Kolkata'}
};
const WMO = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
const wmo = c => WMO[c] ?? 'Unknown';
// Open-Meteo returns local wall-clock strings with no offset, so format them as UTC.
const wall = (s, o) => new Date(s + 'Z').toLocaleTimeString([], {...o, timeZone: 'UTC'});
const aqiLabel = v => v <= 50 ? 'Good' : v <= 100 ? 'Moderate' : v <= 150 ? 'Unhealthy for sensitive groups' : v <= 200 ? 'Unhealthy' : v <= 300 ? 'Very unhealthy' : 'Hazardous';

function buildCityTab(key) {
  const c = CITIES[key], p = c.id;
  $('tab-' + key).innerHTML = `
    <header><h1>${c.name}</h1>
      <span class="mute">Local time <span id="${p}time"></span>. <span id="${p}updated">Loading…</span></span></header>
    <section id="${p}now"><h2>Right now</h2><div class="mute">Loading…</div></section>
    <section><h2>Next 24 hours</h2><div class="strip" id="${p}hourly"></div></section>
    <section><h2>Forecast</h2><div id="${p}daily"></div></section>
    <section><h2>Sun</h2><div class="sun" id="${p}sun"></div></section>
    <section><h2>Warnings and radar</h2>
      <p style="margin:0">Open-Meteo has no alert feed. For cyclone, heavy-rain, and radar information, see the
      <a href="https://mausam.imd.gov.in/" target="_blank" rel="noopener">India Meteorological Department</a>.</p></section>
    <p class="mute">Data: Open-Meteo (open-meteo.com)</p>
    <p class="err" id="${p}err"></p>`;
}

async function loadCity(c) {
  const p = c.id;
  const q = new URLSearchParams({
    latitude: c.lat, longitude: c.lon, timezone: c.tz, forecast_days: 7,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly: 'temperature_2m,precipitation_probability',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max'
  });
  const d = await get('https://api.open-meteo.com/v1/forecast?' + q);
  const cur = d.current;

  let aqi = null;   // optional; the page still works if this call fails
  try { aqi = (await get(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&current=us_aqi&timezone=${c.tz}`)).current.us_aqi; } catch {}

  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const dir = dirs[Math.round(cur.wind_direction_10m / 45) % 8];
  $(p + 'now').innerHTML = `<h2>Right now</h2>
    <div class="temp">${n(cur.temperature_2m)}°C</div>
    <div class="cond">${wmo(cur.weather_code)}</div>
    <dl>
      <dt>Feels like</dt><dd>${n(cur.apparent_temperature)}°C</dd>
      <dt>Wind</dt><dd>${dir} ${n(cur.wind_speed_10m)} km/h, gusts ${n(cur.wind_gusts_10m)}</dd>
      <dt>Humidity</dt><dd>${n(cur.relative_humidity_2m)}%</dd>
      <dt>Pressure</dt><dd>${n(cur.pressure_msl)} hPa</dd>
      ${aqi != null ? `<dt>Air quality</dt><dd>${n(aqi)} (${aqiLabel(aqi)})</dd>` : ''}
    </dl>`;

  const h = d.hourly, start = Math.max(0, h.time.findIndex(t => t >= cur.time.slice(0, 13) + ':00'));
  $(p + 'hourly').innerHTML = h.time.slice(start, start + 24).map((t, i) => {
    const pop = h.precipitation_probability[start + i] ?? 0;
    return `<div class="hr"><span class="mute">${wall(t, {hour: 'numeric'})}</span>
      <b>${n(h.temperature_2m[start + i])}°</b>
      <div class="bar"><i style="width:${pop}%"></i></div><span class="mute">${pop}%</span></div>`;
  }).join('');

  const dl = d.daily;
  $(p + 'daily').innerHTML = dl.time.map((t, i) => {
    const name = i === 0 ? 'Today' : new Date(t + 'T00:00:00Z').toLocaleDateString([], {weekday: 'long', timeZone: 'UTC'});
    const pop = dl.precipitation_probability_max[i] ?? 0;
    return `<div class="day"><strong>${name}</strong>
      <span>${wmo(dl.weather_code[i])}${pop ? ` <span class="mute">· ${pop}% rain</span>` : ''}</span>
      <span class="hilo">${n(dl.temperature_2m_max[i])}° / <span class="mute">${n(dl.temperature_2m_min[i])}°</span></span></div>`;
  }).join('');

  $(p + 'sun').innerHTML = `<div><span class="mute">Sunrise</span><b>${wall(dl.sunrise[0], {hour: 'numeric', minute: '2-digit'})}</b></div>
    <div><span class="mute">Sunset</span><b>${wall(dl.sunset[0], {hour: 'numeric', minute: '2-digit'})}</b></div>
    <div><span class="mute">UV index (max)</span><b>${n(dl.uv_index_max[0], 1)}</b></div>`;
}

const tickClock = c => { $(c.id + 'time').textContent = new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', timeZone: c.tz}); };
const started = {};
function showTab(name) {
  $('tab-de').hidden = name !== 'de';
  for (const k in CITIES) $('tab-' + k).hidden = name !== k;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  const c = CITIES[name];
  if (c && !started[name]) {   // each city only starts polling once its tab is opened
    started[name] = true;
    buildCityTab(name);
    tickClock(c); setInterval(() => tickClock(c), 30000);
    every(30, () => loadCity(c), c.id + 'updated', c.id + 'err', c.tz);
  }
  store('tab', name);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

(async () => {
  try {
    const p = await getPoint();
    TZ = p.timeZone;
    $('place').textContent = `${p.relativeLocation.properties.city}, ${p.relativeLocation.properties.state}`;
    renderSun(p);
    every(5, loadAlerts);
    every(10, () => loadNow(p));
    every(30, () => loadHourly(p));
    every(30, () => loadDaily(p));
    every(5, async () => refreshRadar());
  } catch (e) {
    $('err').textContent = 'Could not reach the National Weather Service: ' + e.message;
  }
})();

const t = load('tab');
showTab(t === 'de' || CITIES[t] ? t : 'de');
</script>
</body>
</html>
